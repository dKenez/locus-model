[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-model"
version = "0.0.1"
description = "LOCUS aims to automate GeoGuessr with Deep Learning. This repository contains the code for the Deep Learning model."
keywords = ["deep learning", "machine learning", "model", "locus", "geoguessr"]
authors = [
    { name = "Krist\u00f3f Ken\u00e9z Drexler", email = "k.k.drexler@gmail.com" },
]
maintainers = [
    { name = "Krist\u00f3f Ken\u00e9z Drexler", email = "k.k.drexler@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.7",
    "fastapi[standard]>=0.115.14",
    "geopy>=2.4.1",
    "msgpack>=1.0.8",
    "networkx>=3.5",
    "numpy>=1.26.3",
    "pandas>=2.2",
    "pillow>=11.3.0",
    "polars>=1.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=16.0",
    "python-dotenv>=1.0.1",
    "randomname>=0.2.1",
    "rich>=13.7.0",
    # polars' DataFrame.write_database (used by locus/data/LDoGI.py to load shards into
    # Postgres) needs a database engine; sqlalchemy is the one polars defaults to.
    "sqlalchemy>=2.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
# Only needed by locus/visualizations; basemap is awkward to build, so it is kept out of
# the default install that training and the API rely on.
viz = [
    "basemap>=1.4.1",
    "basemap-data>=1.3.2",
    "matplotlib>=3.8.2",
]

[dependency-groups]
dev = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.6",
    "mkdocstrings[python]>=0.23.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "pytest>=7.4.3",
    "ruff>=0.1.3",
]

[tool.setuptools]
packages = ["locus"]

# [tool.setuptools.dynamic]
# dependencies = { file = ["requirements.txt"] }

# [tool.setuptools.dynamic.optional-dependencies]
# dev = { file = ["requirements_dev.txt"] }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
]

[tool.mypy]
exclude = ["build/", "data/"]

[[tool.mypy.overrides]]
module = [
    "msgpack",
    "mpl_toolkits.basemap",
    "torchvision.transforms",
    "torchvision.models",
    "randomname",
    "geopy",
]
ignore_missing_imports = true
